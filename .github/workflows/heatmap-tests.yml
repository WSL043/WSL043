name: Heatmap engine tests
on:
  pull_request:
    paths: ['scripts/**', 'tests/**', 'requirements-arcade.txt', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'requirements-arcade.txt', '.github/workflows/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-arcade.txt
      - run: python -m unittest discover -s tests -v
