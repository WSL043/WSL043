name: Daily showcase
# Redraws the Now Playing strip and project cards from public repository data.
on:
  schedule:
    - cron: "40 3 * * *"
  push:
    branches: [main]
    paths: ['scripts/showcase.py', '.github/workflows/showcase.yml']
  workflow_dispatch:
concurrency:
  group: daily-showcase
  cancel-in-progress: false
permissions: {}
jobs:
  showcase:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Draw the showcase
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.showcase
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/showcase
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(profile): refresh showcase cards"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
