name: Daily profile arcade
on:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: [main]
    paths: ['scripts/**', 'requirements-arcade.txt', '.github/workflows/daily-arcade.yml']
  workflow_dispatch:
    inputs:
      experience:
        description: Experience to publish
        required: true
        default: random
        type: choice
        options:
          - random
          - space-shooter
          - breakout
          - snake
          - maze-chase
          - 3d-city
          - bomber
          - miners
          - link-match
          - portal
          - assembly
      generate_all:
        description: Refresh all ten experiences including external generators
        required: true
        default: false
        type: boolean
      refresh_native:
        description: Refresh all five SVG experiences from a fresh calendar
        required: true
        default: true
        type: boolean
concurrency:
  group: daily-profile-arcade
  cancel-in-progress: false
permissions: {}
jobs:
  choose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      selected: ${{ steps.choose.outputs.selected }}
      mode: ${{ steps.choose.outputs.mode }}
      native: ${{ steps.choose.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - id: choose
        name: Draw the next experience
        env:
          REQUESTED_EXPERIENCE: ${{ inputs.experience || (github.event_name == 'push' && 'assembly') || 'random' }}
          GENERATE_ALL: ${{ inputs.generate_all || 'false' }}
          REFRESH_NATIVE: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_native }}
        run: |
          MODE=selected
          if [ "$GENERATE_ALL" = "true" ]; then MODE=all; fi
          export ARCADE_DATE="$(date -u +%F)"
          python scripts/rotate_arcade.py \
            --experience "$REQUESTED_EXPERIENCE" \
            --generation-mode "$MODE" \
            --refresh-native "$REFRESH_NATIVE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rotation-metadata
          path: rotation-output/
          retention-days: 1
  heatmap:
    needs: choose
    if: needs.choose.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rotation-metadata
          path: rotation-output
      - name: Fetch fresh contributions and generate vector SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.heatmap_data --selection rotation-output/selection.json --output generated
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arcade-heatmap
          path: |
            generated/*.svg
            generated/heatmap-manifest.json
            generated/heatmap-snapshot.json
            generated/search-comparison.json
          retention-days: 1
  space-shooter:
    needs: choose
    if: needs.choose.outputs.mode == 'all' || needs.choose.outputs.selected == 'space-shooter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Generate space shooter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check gh-space-shooter==2.0.5
          mkdir -p generated
          gh-space-shooter "${GITHUB_REPOSITORY_OWNER}" --output generated/space-shooter.gif --strategy random --fps 40
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arcade-space-shooter
          path: generated/
          retention-days: 1
  breakout:
    needs: choose
    if: needs.choose.outputs.mode == 'all' || needs.choose.outputs.selected == 'breakout'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cyprieng/github-breakout@60c43dca3a1361fbc9fb9bb533b5193296345c4f
        with:
          github_username: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          output_path: generated/raw
          enable_ghost_bricks: true
      - run: |
          mv generated/raw/light.svg generated/breakout-light.svg
          mv generated/raw/dark.svg generated/breakout-dark.svg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arcade-breakout
          path: generated/*.svg
          retention-days: 1
  snake:
    needs: choose
    if: needs.choose.outputs.mode == 'all' || needs.choose.outputs.selected == 'snake'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            generated/snake-light.svg?palette=github-light&color_snake=#ff7a59
            generated/snake-dark.svg?palette=github-dark&color_snake=#59f3ff
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arcade-snake
          path: generated/
          retention-days: 1
  maze-chase:
    needs: choose
    if: needs.choose.outputs.mode == 'all' || needs.choose.outputs.selected == 'maze-chase'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          games: pacman
          player_style: opportunistic
      - run: |
          mkdir -p generated
          mv dist/pacman-contribution-graph.svg generated/maze-chase-light.svg
          mv dist/pacman-contribution-graph-dark.svg generated/maze-chase-dark.svg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arcade-maze-chase
          path: generated/
          retention-days: 1
  city-3d:
    needs: choose
    if: needs.choose.outputs.mode == 'all' || needs.choose.outputs.selected == '3d-city'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
      - run: |
          mkdir -p generated
          mv profile-3d-contrib/profile-gitblock.svg generated/3d-city.svg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arcade-3d-city
          path: generated/
          retention-days: 1
  publish:
    needs: [choose, heatmap, space-shooter, breakout, snake, maze-chase, city-3d]
    if: >-
      always() && !cancelled() &&
      needs.choose.result == 'success' &&
      (needs.heatmap.result == 'success' || needs.heatmap.result == 'skipped') &&
      (needs['space-shooter'].result == 'success' || needs['space-shooter'].result == 'skipped') &&
      (needs.breakout.result == 'success' || needs.breakout.result == 'skipped') &&
      (needs.snake.result == 'success' || needs.snake.result == 'skipped') &&
      (needs['maze-chase'].result == 'success' || needs['maze-chase'].result == 'skipped') &&
      (needs['city-3d'].result == 'success' || needs['city-3d'].result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rotation-metadata
          path: staging/rotation-metadata
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: arcade-*
          path: staging/generators
          merge-multiple: true
      - name: Reject stale checkout before publishing
        run: |
          CURRENT="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$CURRENT" = "$GITHUB_SHA" || { echo 'main changed during generation; keep the live profile'; exit 1; }
      - name: Validate every SVG and source snapshot before staging
        run: python scripts/publish_arcade.py
      - name: Commit profile rotation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ARCADE.md .github/arcade-state.json assets/arcade
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(profile): refresh full-calendar SVG arcade"
          git push origin HEAD:main
